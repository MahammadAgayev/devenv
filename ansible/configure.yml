- hosts: localhost
  connection: local
  vars:
    home: "{{ lookup('env', 'HOME') }}"
    devenv: "{{ playbook_dir | dirname }}"
    profile: "{{ profile | default('uber') }}"

  tasks:
    - name: Symlink dotfiles
      file:
        src: "{{ devenv }}/dotfiles/{{ item.src }}"
        dest: "{{ home }}/{{ item.dest }}"
        state: link
        force: true
      loop:
        - src: ".zshrc"
          dest: ".zshrc"
        - src: ".p10k.zsh"
          dest: ".p10k.zsh"
        - src: ".tmux.conf"
          dest: ".tmux.conf"
        - src: ".gitconfig"
          dest: ".gitconfig"

    # Oh My Zsh now ships zsh-autosuggestions. The old standalone clone (has its
    # own .git) blocks `omz update` with "untracked files would be overwritten".
    - name: Check for standalone zsh-autosuggestions clone
      stat: { path: "{{ home }}/.oh-my-zsh/plugins/zsh-autosuggestions/.git" }
      register: zsh_as_clone

    - name: Remove standalone zsh-autosuggestions clone
      file:
        path: "{{ home }}/.oh-my-zsh/plugins/zsh-autosuggestions"
        state: absent
      when: zsh_as_clone.stat.exists

    - name: Update Oh My Zsh to restore its bundled zsh-autosuggestions
      shell: ZSH="{{ home }}/.oh-my-zsh" zsh "{{ home }}/.oh-my-zsh/tools/upgrade.sh"
      when: zsh_as_clone.stat.exists

    - name: Ensure ~/.ssh exists
      file:
        path: "{{ home }}/.ssh"
        state: directory
        mode: '0700'

    - name: Set perms on dotfiles/.ssh-config (ssh requires 0600)
      file:
        path: "{{ devenv }}/dotfiles/.ssh-config"
        mode: '0600'

    - name: Symlink ~/.ssh/config
      file:
        src: "{{ devenv }}/dotfiles/.ssh-config"
        dest: "{{ home }}/.ssh/config"
        state: link
        force: true

    - name: Symlink .gitconfig_uber (uber only)
      file:
        src: "{{ devenv }}/dotfiles/.gitconfig_uber"
        dest: "{{ home }}/.gitconfig_uber"
        state: link
        force: true
      when: profile == 'uber'

    - name: Symlink tmux-sessionizer
      file:
        src: "{{ devenv }}/scripts/tmux-sessionizer"
        dest: "{{ home }}/tmux-sessionizer"
        state: link
        force: true
        mode: '0755'

    - name: Symlink tmux-ssh
      file:
        src: "{{ devenv }}/scripts/tmux-ssh"
        dest: "{{ home }}/tmux-ssh"
        state: link
        force: true
        mode: '0755'

    - name: Symlink tclaude
      file:
        src: "{{ devenv }}/scripts/tclaude"
        dest: "{{ home }}/tclaude"
        state: link
        force: true
        mode: '0755'

    - name: Symlink Rex scripts
      file:
        src: "{{ devenv }}/scripts/{{ item }}"
        dest: "{{ home }}/{{ item }}"
        state: link
        force: true
        mode: '0755'
      loop: [rex-sessionizer, rex-ssh, rclaude]

    - name: Ensure ~/.config/rex exists
      file:
        path: "{{ home }}/.config/rex"
        state: directory
        mode: '0755'

    - name: Symlink Rex config
      file:
        src: "{{ devenv }}/rex/init.lua"
        dest: "{{ home }}/.config/rex/init.lua"
        state: link
        force: true

    - name: Ensure ~/.config/ghostty exists
      file:
        path: "{{ home }}/.config/ghostty"
        state: directory
        mode: '0755'

    - name: Symlink ghostty config
      file:
        src: "{{ devenv }}/dotfiles/ghostty.config"
        dest: "{{ home }}/.config/ghostty/config"
        state: link
        force: true

    - name: Symlink nvim config
      file:
        src: "{{ devenv }}/nvim"
        dest: "{{ home }}/.config/nvim"
        state: link
        force: true

    - name: Ensure ~/.claude exists
      file:
        path: "{{ home }}/.claude"
        state: directory
        mode: '0755'

    - name: Symlink Claude settings
      file:
        src: "{{ devenv }}/claude/{{ profile }}.json"
        dest: "{{ home }}/.claude/settings.json"
        state: link
        force: true

    - name: Symlink Claude instructions (CLAUDE.md)
      file:
        src: "{{ devenv }}/agents/AGENTS.md"
        dest: "{{ home }}/.claude/CLAUDE.md"
        state: link
        force: true

    - name: Ensure ~/.claude/hooks exists
      file:
        path: "{{ home }}/.claude/hooks"
        state: directory
        mode: '0755'

    - name: Symlink RTK hook
      file:
        src: "{{ devenv }}/claude/hooks/rtk-rewrite.sh"
        dest: "{{ home }}/.claude/hooks/rtk-rewrite.sh"
        state: link
        force: true
        mode: '0755'

    # Deployed only where a go-code checkout actually exists, rather than being
    # gated on a hand-maintained workspace setting.
    - name: Check for go-code checkout
      stat: { path: "{{ home }}/go-code" }
      register: go_code

    - name: Symlink go-code envrc (uber only, if go-code exists)
      file:
        src: "{{ devenv }}/dotfiles/.gomonorepo.envrc.local"
        dest: "{{ home }}/go-code/.envrc.local"
        state: link
        force: true
      when: profile == 'uber' and go_code.stat.exists

    # ulsp.sh autodetects the monorepo (go-code/fievel), so it is deployed for
    # any uber machine.
    - name: Ensure ~/ulsp exists (uber only)
      file:
        path: "{{ home }}/ulsp"
        state: directory
        mode: '0755'
      when: profile == 'uber'

    - name: Symlink ulsp.sh (uber only)
      file:
        src: "{{ devenv }}/scripts/ulsp.sh"
        dest: "{{ home }}/ulsp/ulsp.sh"
        state: link
        force: true
        mode: '0755'
      when: profile == 'uber'

    # Pi and harness were removed from devenv. Only symlinks are removed, so
    # pi's own sessions, memory, and auth in ~/.pi stay.
    - name: Check old Pi and harness symlinks
      stat: { path: "{{ home }}/{{ item }}" }
      register: pi_links
      loop:
        - .pi/agent/AGENTS.md
        - .pi/agent/models.json
        - .pi/agent/settings.json
        - .pi/agent/keybindings.json
        - .pi/agent/agents
        - tpi
        - .local/bin/harness

    - name: Remove old Pi and harness symlinks
      file:
        path: "{{ item.stat.path }}"
        state: absent
      loop: "{{ pi_links.results }}"
      loop_control: { label: "{{ item.item }}" }
      when: item.stat.islnk | default(false)

    - name: Install devenv post-merge hook
      file:
        src: "{{ devenv }}/git-hooks/devenv-post-merge"
        dest: "{{ devenv }}/.git/hooks/post-merge"
        state: link
        force: true
        mode: '0755'
